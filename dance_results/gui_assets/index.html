<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="dance-token" content="SESSION_TOKEN">
  <title>熱舞 Online · 我的歌曲庫</title>
  <link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/lamps.css"><script src="/lamps.js" defer></script><script src="/app.js" defer></script><script src="/game-sync.js" defer></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><div><h1>我的歌曲庫</h1></div></div>
  <div class="header-actions">
    <nav aria-label="主要導覽">
    <a class="page-link" href="/" aria-current="page">歌曲庫</a>
    <a class="page-link" href="/history">歷史成績</a>
    <a class="page-link" href="/plays">遊玩排行</a>
    </nav>
    <button id="game-button" title="從遊戲直接讀成績與歌單">遊戲資料夾</button>
    <button id="scan-button" class="primary">↻ 更新歌曲庫</button>
  </div>
</header>
<div class="library-bar"><div class="library-picker" hidden><label for="root">歌曲庫位置</label><select id="root" aria-label="歌曲庫位置"></select></div><div id="totals" class="totals" aria-live="polite">正在載入歌曲庫…</div></div>
<div id="game-status" class="game-status" role="status" aria-live="polite" hidden></div>
<div id="message" class="message" role="status" hidden></div>
<div id="scan-status" class="scan-status" aria-live="polite" hidden></div>
<dialog id="game-dialog" aria-labelledby="game-title"><h2 id="game-title">遊戲資料夾</h2>
<p class="game-help">選有 <code>dance.exe</code> 的那一層。設定好之後，每打完一首歌，成績會自動存進來；官方歌與外部歌（含 StepMania／osu 資料夾）的歌單也跟遊戲同步。</p>
<label class="game-dir-label" for="game-dir">資料夾路徑</label><input id="game-dir" type="text" autocomplete="off" spellcheck="false" placeholder="例如 D:\Dance v2.0.0">
<label class="game-dir-label" for="game-character">角色（只存這個角色的成績）</label><select id="game-character" disabled><option>先儲存遊戲資料夾</option></select>
<p id="game-error" class="game-error" role="alert" hidden></p><p id="game-result" class="game-result" role="status" hidden></p>
<div id="game-detail" class="game-detail"></div>
<div class="dialog-actions"><button id="game-cancel">關閉</button><button id="game-save" class="primary">儲存並同步</button></div></dialog>
<main class="workspace">
  <aside class="packs-panel" aria-label="Pack 瀏覽"><div class="panel-heading"><h2>音樂收藏</h2></div><nav id="pack-list" aria-label="Pack 清單"></nav></aside>
  <section class="songs-panel" aria-label="歌曲清單"><div class="list-heading"><div><h2 id="list-title">全部歌曲</h2></div><span id="result-count" class="count-pill">—</span></div>
    <div class="search-tools"><label class="search-box"><input id="search" type="search" autocomplete="off" aria-label="搜尋歌曲名稱" placeholder="搜尋歌名、Pack 或資料夾…"></label><select id="sort" aria-label="歌曲排序"><option value="asc">名稱 A → Z</option><option value="desc">名稱 Z → A</option><option value="plays_desc">遊玩次數 多 → 少</option><option value="plays_asc">遊玩次數 少 → 多</option></select>
      <select id="lamp-filter" aria-label="Clear 狀態：任一難度的最佳燈號" title="任一 EASY / NORMAL / HARD 的最佳燈號符合；未取得燈號也算未通關">
        <option value="">Clear 狀態：全部</option>
        <option value="ACP">ACP</option>
        <option value="AC">AC</option>
        <option value="CLEAR">CLEAR</option>
        <option value="FAILED">FAILED</option>
        <option value="UNCLEARED">未通關</option>
        <option value="CLEARED">已通關</option>
      </select>
      <button id="clear-search" type="button">清除條件</button>
    </div>
    <div class="list-hint">歌名 <span>Pack / SongFolder</span></div><div id="song-list" role="list" aria-label="查詢結果"></div>
    <footer class="pagination"><span id="page-info" aria-live="polite">—</span><div><button id="previous" aria-label="上一頁" disabled>←</button><button id="next" aria-label="下一頁" disabled>→</button></div></footer>
  </section>
  <aside class="details-panel" aria-label="歌曲詳細資訊"><div id="details"><div class="empty-details"><h2>選擇一首歌曲</h2><p>查看來源資訊，並設定遊戲內的<br>EASY、NORMAL、HARD 難度資料。</p><span class="small-tag">未知 LV 與音符數顯示「未設定」</span></div></div></aside>
</main>
<footer class="app-footer"><span id="database-path">連線中</span><span data-motion-slot></span><span>正式提交後更新燈號 · BEST EX 與最佳燈號分別保存</span></footer>
</body></html>
